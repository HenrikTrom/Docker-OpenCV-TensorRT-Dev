services:
  opencv-tensorrt-dev:
    container_name: ${TAG1}
    platform: linux/amd64
    build:
      context: ./build
      args:
        UBUNTU_IMAGE_VERSION: ${UBUNTU_IMAGE_VERSION}
        CUDA_VERSION: ${CUDA_VERSION}
        TENSORRT_VERSION: ${TENSORRT_VERSION}
        CUDA_ARCH_BIN: ${CUDA_ARCH_BIN}
        OPENCV_VERSION: ${OPENCV_VERSION}
        UID: ${UID}
        GID: ${GID}
        CMAKE_VERSION: ${CMAKE_VERSION}
        CPP_OPTIMIZATIONS: ${CPP_OPTIMIZATIONS}
    image: my/${TAG1}

    command: tail -f /dev/null
    tty: true

    gpus: all
    # Explicit device nodes mitigate the known Docker/runc/systemd-cgroup case
    # where long-running containers can lose GPU access after container updates.
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia-modeset:/dev/nvidia-modeset

    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TERM=xterm-256color
      - DEBUG_COLORS=true
      - COLORTERM=truecolor

    volumes:
      - ./:/home/docker/workspace
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

